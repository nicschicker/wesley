name: Supabase wach halten

# Gratis-Projekte pausieren nach rund einer Woche ohne Aktivität.
# Dieser Job ruft einmal täglich den Health-Check der App auf.
# Voraussetzung: Repository-Variable APP_URL (z. B. https://wesley-xyz.vercel.app).

on:
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Health-Check aufrufen
        env:
          APP_URL: ${{ vars.APP_URL }}
        run: |
          if [ -z "$APP_URL" ]; then
            echo "APP_URL ist nicht gesetzt, überspringe."
            exit 0
          fi
          curl --fail --silent --show-error --max-time 30 "$APP_URL/api/health"
